version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  airflow-webserver:
    image: apache/airflow:2.7.2-python3.10
    depends_on:
      - postgres
    env_file:
      - .env  
    environment:
      - TZ=Asia/Shanghai  
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__PARALLELISM=16  
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      # 🎯 修正点 1：锁死黄金组合版本，防止下载到引发 Expected 96 错误的 numpy 2.x 和新版 pandas
      - _PIP_ADDITIONAL_REQUIREMENTS=numpy==1.23.5 pandas==1.5.3 dbt-bigquery==1.5.0
      - AIRFLOW__SMTP__SMTP_HOST=smtp.qq.com              
      - AIRFLOW__SMTP__SMTP_STARTTLS=True
      - AIRFLOW__SMTP__SMTP_SSL=False
      - AIRFLOW__SMTP__SMTP_PORT=587                      
      - AIRFLOW__SMTP__SMTP_USER=${EMAIL_USER}         
      - AIRFLOW__SMTP__SMTP_PASSWORD=${EMAIL_PASSWORD}   
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=${EMAIL_USER}    
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins  
      # 📂 虫洞 1：挂载 dbt 施工图纸目录
      - ../../../Modern-E-commerce-Data-Platform/dbt:/opt/airflow/dbt
      # 🔒 虫洞 2：直接挂载躺在大项目根目录下的那把物理钥匙，送到容器内的 /opt/airflow/profiles/ 目录下
      - ../../../Modern-E-commerce-Data-Platform/profiles.yml:/opt/airflow/profiles/profiles.yml
    command: webserver
    restart: always

  airflow-scheduler:
    image: apache/airflow:2.7.2-python3.10
    depends_on:
      - postgres
    env_file:
      - .env  
    environment:
      - TZ=Asia/Shanghai  
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__PARALLELISM=16
      # 🎯 修正点 2：必须与 webserver 严格保持一致，防止调度器在执行任务时因为没有指定而使用不同的隐式版本
      - _PIP_ADDITIONAL_REQUIREMENTS=numpy==1.23.5 pandas==1.5.3 dbt-bigquery==1.5.0
      - AIRFLOW__SMTP__SMTP_HOST=smtp.qq.com              
      - AIRFLOW__SMTP__SMTP_STARTTLS=True
      - AIRFLOW__SMTP__SMTP_SSL=False
      - AIRFLOW__SMTP__SMTP_PORT=587                      
      - AIRFLOW__SMTP__SMTP_USER=${EMAIL_USER}         
      - AIRFLOW__SMTP__SMTP_PASSWORD=${EMAIL_PASSWORD}   
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=${EMAIL_USER}    
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      # 📂 虫洞 1：挂载 dbt 施工图纸目录
      - ../../../Modern-E-commerce-Data-Platform/dbt:/opt/airflow/dbt
      # 🔒 虫洞 2：保证车间调度器同样能拿到大项目根目录下的这把钥匙
      - ../../../Modern-E-commerce-Data-Platform/profiles.yml:/opt/airflow/profiles/profiles.yml
    command: scheduler
    restart: always

  airflow-init:
    image: apache/airflow:2.7.2-python3.10
    depends_on:
      - postgres
    environment:
      - TZ=Asia/Shanghai  
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _AIRFLOW_WWW_USER_FIRSTNAME=Yuto
      - _AIRFLOW_WWW_USER_LASTNAME=Wong
      - _AIRFLOW_WWW_USER_EMAIL=yuto@example.com
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
    command: version  
    restart: "no"

volumes:
  postgres_data: