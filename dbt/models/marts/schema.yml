version: 2

models:
  # 1. 客户维度表 
  - name: dim_customers
    description: "客户价值分析维度表，包含基于 RFM 模型的分群结果。"
    columns:
      - name: customer_unique_id
        description: "PK. 客户全局唯一标识。"
        tests:
          - unique
          - not_null
      - name: customer_segment
        description: "{{ doc('olist_rfm_logic') }}"
        tests:
          - accepted_values:
              values: ['重要价值客户', '重要发展客户', '一般客户', '重要保持客户', '重要挽留客户']
              config:
                severity: warn

  # 2. 订单维度表
  - name: dim_orders
    description: "订单基础信息表，标准化了所有关键生命周期时间戳。"
    columns:
      - name: order_id
        description: "PK. 订单唯一识别码。"
        tests: [unique, not_null]
      - name: order_status
        description: "{{ doc('olist_order_status_definition') }}"
      - name: purchased_at
        description: "下单时间 (UTC)。命名规范：统一使用 _at 结尾表示时间戳。"

  # 3. 订单项事实表 
  - name: fact_order_items
    description: "最细粒度的业务事实表，记录单笔商品的交易及物流分摊情况。"
    columns:
      - name: order_item_key
        description: "SK. 基于 order_id 与 order_item_id 生成的代理键。"
        tests:
          - not_null
      - name: freight_ratio
        description: "口径定义：运费占订单项总价值的比率 (freight / total_value)。用于监控高运费异常商品。"
      - name: total_item_value
        description: "订单项总价（单价 + 运费）。"
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
              config:
                severity: warn
      - name: seller_id
        tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
              config:
                severity: warn

  # 4. 商品维度表 
  - name: dim_products
    description: "商品属性表，整合了类别翻译及逻辑分类。"
    columns:
      - name: product_id
        description: "PK. 商品唯一标识。"
      - name: weight_class
        description: "{{ doc('olist_weight_class_definition') }}"
        tests:
          - accepted_values:
              values: ['light weight', 'middle weight', 'heavy weight']

  # 5. 支付事实表 
  - name: dim_payments
    description: "订单支付维度表，记录多种支付方式的并行交易情况。"
    columns:
      - name: total_payment_value
        description: "该订单的总实付金额。应等于所有支付流水之和。"
  
  # 6. 地理信息表
  - name: dim_geo
    description: "涉及详细地理信息的表"
    columns:
      - name: geolocation_zip_code_prefix
        tests:
          - not_null

  # 7. 卖家表
  - name: dim_sellers
    description: "涉及卖家信息的表，包括id，城市，邮编"
    columns:
      - name: seller_id
        tests:
          - not_null

  # --- Analytics Marts (沉淀自 olist_analysis/ 探索分析) ---

  - name: mart_daily_gmv_trend
    description: "日 GMV / 订单量趋势，含日环比、周环比及 30 天滑动异常检测。"
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: anomaly_status
        tests:
          - accepted_values:
              values: ['CRITICAL', 'WARNING', 'NORMAL']

  - name: mart_logistics_timeliness
    description: "订单级物流时效宽表，含各节点耗时（小时）与时效分级。"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: timely_level
        tests:
          - accepted_values:
              values: ['极快', '较快', '一般', '较慢']

  - name: mart_user_behavior
    description: "用户行为画像：首单/末单、消费、复购间隔、生命周期标签。"
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]
      - name: user_tag
        tests:
          - accepted_values:
              values: ['新客', '复购', '沉睡', '流失', '其他']

  - name: mart_customer_kpi
    description: "平台级客户 KPI 快照：复购率、忠诚客户占比。"
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: repurchase_rate_pct
        tests:
          - not_null

  - name: mart_city_sales_rank
    description: "城市维度订单量与 GMV 排名，支持区域分析。"
    columns:
      - name: city
        tests: [not_null]

